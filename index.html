<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#3b82f6">
  <title>My To-Do List</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    /* --- tweakcn theme tokens (Inter, radius 10px) --- */
    :root {
      --background: oklch(0.9846 0.0017 247.8389);
      --foreground: oklch(0.2057 0.0151 248.5628);
      --card: oklch(1.0000 0 0);
      --card-foreground: oklch(0.2057 0.0151 248.5628);
      --primary: oklch(0.6225 0.1882 254.0875);
      --primary-foreground: oklch(0.9846 0.0017 247.8389);
      --secondary: oklch(0.9545 0.0046 258.3249);
      --secondary-foreground: oklch(0.2648 0.0165 248.4511);
      --muted: oklch(0.9545 0.0046 258.3249);
      --muted-foreground: oklch(0.5207 0.0140 248.0971);
      --accent: oklch(0.9297 0.0184 250.5952);
      --accent-foreground: oklch(0.2236 0.0164 252.4812);
      --destructive: oklch(0.6203 0.2206 25.6388);
      --border: oklch(0.8903 0.0064 255.4784);
      --input: oklch(0.8903 0.0064 255.4784);
      --ring: oklch(0.6225 0.1882 254.0875);
      --chart-1: oklch(0.6225 0.1882 254.0875);
      --chart-2: oklch(0.6612 0.1204 171.9631);
      --chart-3: oklch(0.6920 0.1516 68.2309);
      --chart-4: oklch(0.6408 0.1898 22.1208);
      --radius: 0.625rem;
      --shadow-xs: 0px 4px 10px 0px hsl(0, 0, 0 / 0.05);
      --shadow-sm: 0px 4px 10px 0px hsl(0, 0, 0 / 0.10), 0px 1px 2px -1px hsl(0, 0, 0 / 0.10);
    }

    body.dark {
      --background: oklch(0.1757 0.0122 254.1481);
      --foreground: oklch(0.9409 0.0059 239.8225);
      --card: oklch(0.2154 0.0141 253.1323);
      --card-foreground: oklch(0.9409 0.0059 239.8225);
      --primary: oklch(0.6969 0.1630 252.9094);
      --primary-foreground: oklch(0.1757 0.0122 254.1481);
      --secondary: oklch(0.2653 0.0142 248.3607);
      --secondary-foreground: oklch(0.9409 0.0059 239.8225);
      --muted: oklch(0.2653 0.0142 248.3607);
      --muted-foreground: oklch(0.6998 0.0123 252.1295);
      --accent: oklch(0.3050 0.0220 251.2541);
      --accent-foreground: oklch(0.9654 0.0042 236.4970);
      --destructive: oklch(0.6791 0.1899 25.3623);
      --border: oklch(0.3147 0.0128 252.9992);
      --input: oklch(0.3147 0.0128 252.9992);
      --ring: oklch(0.6969 0.1630 252.9094);
      --chart-1: oklch(0.6969 0.1630 252.9094);
      --chart-2: oklch(0.7208 0.1204 171.9037);
      --chart-3: oklch(0.7610 0.1501 71.2299);
      --chart-4: oklch(0.7105 0.1799 22.0201);
      --shadow-xs: 0px 10px 20px 0px hsl(0, 0, 0 / 0.25);
      --shadow-sm: 0px 10px 20px 0px hsl(0, 0, 0 / 0.50), 0px 1px 2px -1px hsl(0, 0, 0 / 0.50);
    }

    body.dark #task-list li.due-overdue { background: #450a0a; border-left-color: var(--chart-4); }
    body.dark #task-list li.due-today,
    body.dark #task-list li.due-tomorrow { background: #451a03; border-left-color: var(--chart-3); }
    body.dark #task-list li.due-soon { background: #172554; border-left-color: var(--chart-1); }
    body.dark #task-list li.due-later { background: #052e16; border-left-color: var(--chart-2); }
    body.dark .due-overdue .due-badge { background: #7f1d1d; color: #fecaca; }
    body.dark .due-today .due-badge,
    body.dark .due-tomorrow .due-badge { background: #78350f; color: #fde68a; }
    body.dark .due-soon .due-badge { background: #1e3a8a; color: #bfdbfe; }
    body.dark .due-later .due-badge { background: #14532d; color: #bbf7d0; }

    /* --- Base --- */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      letter-spacing: -0.01em;
      background: var(--background);
      color: var(--foreground);
      margin: 0;
      padding: 32px 16px;
      min-height: 100vh;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      container-type: inline-size; /* container queries adapt composer, not viewport */
    }

    /* Dim list while editing; highlight rows holding hovered tag */
    #task-list:has(.edit-input) { opacity: 0.85; }
    #task-list li:has(.tag-chip:hover) { border-color: var(--ring); }

    /* View Transitions: smooth morphs, honor reduced motion */
    ::view-transition-old(root),
    ::view-transition-new(root) { animation-duration: 0.18s; }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-old(root),
      ::view-transition-new(root) { animation: none; }
    }

    /* Toolbar: icon buttons under filters */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .toolbar button {
      padding: 5px 12px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      background: var(--card);
      color: var(--muted-foreground);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow-xs);
    }

    .toolbar button:hover {
      color: var(--foreground);
      background: var(--accent);
    }

    .toolbar button[aria-pressed="true"] {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: transparent;
    }

    /* Narrow container: stack composer vertically */
    @container (max-width: 420px) {
      .input-row { flex-direction: column; }
      #add-btn { width: 100%; }
      .toolbar { justify-content: stretch; }
      .toolbar button { flex: 1 1 auto; }
    }

    /* Help popover (native top-layer) */
    #help-popover {
      max-width: 320px;
      padding: 16px 18px;
      font: inherit;
      font-size: 0.9rem;
      color: var(--foreground);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    #help-popover::backdrop {
      background: rgba(0, 0, 0, 0.25);
    }

    #help-popover kbd {
      padding: 1px 6px;
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    /* Print: list only, black on white */
    @media print {
      body { background: #fff; padding: 0; }
      .input-row, .filters, .toolbar, .tag-bar, #theme-btn,
      .edit-btn, .delete-btn, .drag-handle, #help-popover { display: none; }
      .app { max-width: 100%; }
      #task-list li {
        box-shadow: none;
        border: 1px solid #999;
        break-inside: avoid;
      }
      .counter { color: #000; }
    }

    /* --- Header --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 14px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    #theme-btn {
      background: var(--card);
      color: var(--foreground);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 6px 11px;
      line-height: 1;
      box-shadow: var(--shadow-xs);
    }

    #theme-btn:hover {
      background: var(--accent);
    }

    /* --- Composer card --- */
    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 2px);
      padding: 8px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    #task-input {
      flex: 1 1 160px;
      min-width: 0;
      padding: 9px 12px;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid transparent;
      border-radius: calc(var(--radius) - 2px);
    }

    #task-input:focus {
      outline: none;
      border-color: var(--ring);
      background: var(--background);
    }

    #due-input {
      padding: 9px 10px;
      font: inherit;
      font-size: 0.9rem;
      color: var(--muted-foreground);
      background: var(--background);
      border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
    }

    #add-btn {
      padding: 9px 18px;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      background: var(--primary);
      color: var(--primary-foreground);
      border: 1px solid transparent;
      border-radius: calc(var(--radius) - 2px);
      cursor: pointer;
    }

    #add-btn:hover {
      filter: brightness(0.95);
    }

    /* --- Filter tabs (segmented) --- */
    .filters {
      display: flex;
      gap: 2px;
      width: fit-content;
      margin: 0 auto 12px;
      padding: 3px;
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .filters button {
      padding: 6px 16px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
    }

    .filters button.active {
      background: var(--card);
      color: var(--foreground);
      box-shadow: var(--shadow-xs);
    }

    /* --- Tag filter bar --- */
    .tag-bar {
      display: none;
      justify-content: center;
      margin-bottom: 12px;
    }

    .tag-bar.visible {
      display: flex;
    }

    .tag-bar button {
      padding: 4px 12px;
      font-size: 0.85rem;
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-foreground);
      cursor: pointer;
    }

    /* --- Task rows --- */
    #task-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #task-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-xs);
      animation: slide-in 0.25s ease-out;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    #task-list li:hover {
      transform: translateY(-1px);
    }

    /* Urgency: solid stripe + matching tint (explicit tints; color-mix shifts hue at low %) */
    #task-list li.due-overdue { border-left-color: var(--chart-4); background: #fef2f2; }
    #task-list li.due-today { border-left-color: var(--chart-3); background: #fffbeb; }
    #task-list li.due-tomorrow { border-left-color: var(--chart-3); background: #fffbeb; }
    #task-list li.due-soon { border-left-color: var(--chart-1); background: #eff6ff; }
    #task-list li.due-later { border-left-color: var(--chart-2); background: #ecfdf5; }
    #task-list li.due-none { border-left-color: var(--border); }

    #task-list li.completed {
      opacity: 0.7;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .due-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      background: var(--secondary);
      color: var(--secondary-foreground);
    }

    .due-overdue .due-badge { background: #fee2e2; color: #b91c1c; }
    .due-today .due-badge { background: #fef3c7; color: #92400e; }
    .due-tomorrow .due-badge { background: #fef3c7; color: #92400e; }
    .due-soon .due-badge { background: #dbeafe; color: #1d4ed8; }
    .due-later .due-badge { background: #d1fae5; color: #065f46; }

    @media (prefers-reduced-motion: reduce) {
      #task-list li { animation: none; transition: none; }
    }

    /* Round checkbox */
    #task-list input[type="checkbox"] {
      appearance: none;
      flex: none;
      width: 18px;
      height: 18px;
      margin: 0;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-content: center;
    }

    #task-list input[type="checkbox"]:checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    #task-list input[type="checkbox"]:checked::after {
      content: "✓";
      color: var(--primary-foreground);
      font-size: 11px;
      line-height: 1;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    #task-list li.completed .task-text {
      text-decoration: line-through;
      color: var(--muted-foreground);
    }

    .tag-chip {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 1px 8px;
      margin: 0 2px;
      border: none;
      border-radius: 999px;
      background: var(--secondary);
      color: var(--secondary-foreground);
      cursor: pointer;
      font-family: inherit;
    }

    .edit-input {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      font: inherit;
      color: inherit;
      background: var(--background);
      border: 1px solid var(--ring);
      border-radius: calc(var(--radius) - 4px);
    }

    .drag-handle {
      cursor: grab;
      color: var(--muted-foreground);
      padding: 4px 2px;
      user-select: none;
      touch-action: none;
    }

    #task-list li.drag-over {
      outline: 2px dashed var(--ring);
      outline-offset: -2px;
    }

    .edit-btn,
    .delete-btn {
      background: transparent;
      border: none;
      border-radius: calc(var(--radius) - 4px);
      cursor: pointer;
      color: var(--muted-foreground);
      padding: 4px 8px;
      font-size: 1rem;
    }

    .edit-btn:hover {
      color: var(--primary);
      background: var(--accent);
    }

    .delete-btn:hover {
      color: var(--destructive);
      background: var(--accent);
    }

    .empty-message {
      text-align: center;
      color: var(--muted-foreground);
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 20px 12px;
    }

    .counter {
      margin: 12px 0 0;
      font-size: 0.85rem;
      color: var(--muted-foreground);
      text-align: center;
    }

    :focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>My To-Do List</h1>
      <button id="theme-btn" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="input-row">
      <input id="task-input" type="text" placeholder="What needs doing? Try milk #home" autocomplete="off" aria-label="New task">
      <input id="due-input" type="date" aria-label="Due date (optional)">
      <button id="add-btn">Add</button>
    </div>
    <div class="filters">
      <button data-filter="all" class="active" aria-pressed="true">All</button>
      <button data-filter="active" aria-pressed="false">Active</button>
      <button data-filter="completed" aria-pressed="false">Completed</button>
    </div>
    <div class="tag-bar" id="tag-bar">
      <button id="tag-clear"></button>
    </div>
    <div class="toolbar">
      <button id="copy-btn" title="Copy tasks as text">Copy</button>
      <button id="paste-btn" title="Paste tasks from clipboard">Paste</button>
      <button id="share-btn" title="Share via OS sheet">Share</button>
      <button id="export-btn" title="Download tasks as JSON">Export</button>
      <button id="import-btn" title="Import tasks from JSON">Import</button>
      <button id="notify-btn" aria-pressed="false" title="Due-date reminders">Remind</button>
      <button id="help-btn" title="Keyboard shortcuts (?)">?</button>
    </div>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
    <div id="help-popover" popover>
      <strong>Shortcuts</strong>
      <p><kbd>/</kbd> new task · <kbd>Alt</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> reorder<br><kbd>Enter</kbd> save edit · <kbd>Esc</kbd> cancel</p>
    </div>
    <ul id="task-list"></ul>
    <p class="counter" id="counter" aria-live="polite"></p>
  </div>

  <script>
    // --- Our data: a plain array of { text, done, due } objects ---
    // due is a "YYYY-MM-DD" string or "" when no date was picked.
    let tasks = [];
    let filter = 'all'; // all | active | completed
    let activeTag = ''; // '' = no tag filter
    let dragIndex = -1; // index in tasks[] of dragged row
    // --- Grab the elements we need ---
    const input = document.getElementById('task-input');
    const dueInput = document.getElementById('due-input');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('task-list');
    const counter = document.getElementById('counter');
    const themeBtn = document.getElementById('theme-btn');
    const tagBar = document.getElementById('tag-bar');
    const tagClear = document.getElementById('tag-clear');
    // PWA: register service worker when served over http(s), skip on file://.
    if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* offline optional */ });
    }
    // --- Load saved tasks when the page opens ---
    loadTasks();
    render();
    requestPersist();
    updateBadge();

    // Best-effort: ask browser to persist storage (may return false).
    function requestPersist() {
      try {
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist().then(function (ok) {
            if (!ok) note('Storage may be cleared by the browser — use Export for backup.');
          });
        }
      } catch (e) { /* best-effort only */ }
    }

    // Transient note in counter line (restored on next render).
    function note(text) { counter.textContent = text; }

    // Render with View Transitions when available, plain otherwise.
    function renderView() {
      if (document.startViewTransition &&
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.startViewTransition(function () { render(); });
      } else {
        render();
      }
    }

     // --- Theme: stored choice wins, else OS preference ---
     initTheme();
    themeBtn.addEventListener('click', function () {
      const dark = !document.body.classList.contains('dark');
      applyTheme(dark, true);
    });

    function initTheme() {
      const saved = localStorage.getItem('todo-theme');
      const dark = saved ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(dark, false);
    }

    function applyTheme(dark, save) {
      document.body.classList.toggle('dark', dark);
      themeBtn.textContent = dark ? '☀️' : '🌙';
      if (save) localStorage.setItem('todo-theme', dark ? 'dark' : 'light');
    }

    // --- Tags: #word in text becomes a clickable chip ---
    function taskTags(text) {
      const tags = text.match(/#[\p{L}\p{N}_-]+/gu);
      return tags ? tags.map(function (t) { return t.toLowerCase(); }) : [];
    }

    function renderTextWithTags(span, text) {
      span.textContent = '';
      const parts = text.split(/(#[\p{L}\p{N}_-]+)/gu);
      parts.forEach(function (part) {
        if (/^#[\p{L}\p{N}_-]+$/u.test(part)) {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'tag-chip';
          chip.textContent = part.toLowerCase();
          chip.dataset.tag = part.toLowerCase();
          span.append(chip);
        } else if (part) {
          span.append(document.createTextNode(part));
        }
      });
    }

    tagClear.addEventListener('click', function () {
      activeTag = '';
      renderView();
    });

    // --- Toolbar: clipboard, share, export/import, reminders, help ---
    const copyBtn = document.getElementById('copy-btn');
    const pasteBtn = document.getElementById('paste-btn');
    const shareBtn = document.getElementById('share-btn');
    const exportBtn = document.getElementById('export-btn');
    const importBtn = document.getElementById('import-btn');
    const importFile = document.getElementById('import-file');
    const notifyBtn = document.getElementById('notify-btn');
    const helpBtn = document.getElementById('help-btn');
    const helpPopover = document.getElementById('help-popover');

    function tasksAsText() {
      return tasks.map(function (t) {
        return (t.done ? '[x] ' : '[ ] ') + t.text + (t.due ? ' (' + t.due + ')' : '');
      }).join('\n');
    }

    // Copy visible list as text; fallback prompt when clipboard blocked.
    copyBtn.addEventListener('click', function () {
      const text = tasksAsText();
      if (!text) { note('Nothing to copy yet.'); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { note('Copied ' + tasks.length + ' tasks.'); },
          function () { window.prompt('Copy tasks:', text); });
      } else {
        window.prompt('Copy tasks:', text);
      }
    });

    // Paste: one task per line ("[x] text (YYYY-MM-DD)" understood).
    pasteBtn.addEventListener('click', function () {
      if (!(navigator.clipboard && navigator.clipboard.readText)) {
        note('Clipboard read unavailable — type tasks or use Import.');
        return;
      }
      navigator.clipboard.readText().then(function (text) {
        importLines(text.split(/\r?\n/));
      }, function () {
        note('Clipboard blocked — allow access or use Import.');
      });
    });

    function importLines(lines) {
      let added = 0;
      lines.forEach(function (line) {
        const text = line.trim().replace(/^\[[ xX]\]\s*/, '');
        if (!text) return;
        const m = text.match(/\(?(\d{4}-\d{2}-\d{2})\)?\s*$/);
        let due = '';
        let body = text;
        if (m && isValidDue(m[1])) { due = m[1]; body = text.slice(0, m.index).trim(); }
        if (!body) return;
        tasks.push({ text: body, done: /^\[x\]/i.test(line.trim()), due: due });
        added++;
      });
      if (added) { saveTasks(); renderView(); note('Added ' + added + ' tasks.'); }
      else note('No tasks found in pasted text.');
      updateBadge();
    }

    // Share via OS sheet; hide button where unsupported.
    if (!navigator.share) shareBtn.hidden = true;
    shareBtn.addEventListener('click', function () {
      const text = tasksAsText();
      if (!text) { note('Nothing to share yet.'); return; }
      navigator.share({ title: 'My To-Do List', text: text }).catch(function () { /* dismissed */ });
    });

    // Export JSON download; import validates shape like loadTasks.
    exportBtn.addEventListener('click', function () {
      const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'todo-tasks.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    });

    importBtn.addEventListener('click', function () { importFile.click(); });
    importFile.addEventListener('change', function () {
      const f = importFile.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed) || !parsed.every(validTask)) throw new Error('bad shape');
          tasks = parsed.map(function (t) { return { text: t.text, done: t.done, due: t.due || '' }; });
          saveTasks(); renderView(); note('Imported ' + tasks.length + ' tasks.');
        } catch (e) {
          note('Import failed — not a todo-tasks JSON file.');
        }
        importFile.value = '';
        updateBadge();
      };
      reader.readAsText(f);
    });

    // Reminders: foreground-only Notification on load when enabled.
    if (!('Notification' in window)) notifyBtn.hidden = true;
    else if (Notification.permission === 'granted' && localStorage.getItem('todo-remind') === 'on') {
      notifyBtn.setAttribute('aria-pressed', 'true');
      notifyBtn.textContent = 'Remind on';
      fireReminder();
    }
    notifyBtn.addEventListener('click', function () {
      if (Notification.permission === 'granted') {
        toggleRemind(localStorage.getItem('todo-remind') !== 'on');
      } else if (Notification.permission === 'denied') {
        note('Notifications blocked — enable in browser settings.');
      } else {
        Notification.requestPermission().then(function (p) {
          if (p === 'granted') { toggleRemind(true); fireReminder(); }
          else note('Reminders need notification permission.');
        });
      }
    });

    function toggleRemind(on) {
      localStorage.setItem('todo-remind', on ? 'on' : 'off');
      notifyBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      notifyBtn.textContent = on ? 'Remind on' : 'Remind';
      if (on) note('Reminders on — overdue/today ping on open.');
    }

    function dueSoonTasks() {
      return tasks.filter(function (t) {
        return !t.done && (dueStatus(t) === 'overdue' || dueStatus(t) === 'today');
      });
    }

    function fireReminder() {
      try {
        const due = dueSoonTasks();
        if (due.length) new Notification(due.length + ' tasks due', { body: due.slice(0, 3).map(function (t) { return t.text; }).join('\n') });
      } catch (e) { /* notifications best-effort */ }
    }

    // Help popover + global shortcuts (/ focus, ? help).
    helpBtn.addEventListener('click', function () { helpPopover.togglePopover(); });
    document.addEventListener('keydown', function (event) {
      const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) ||
        document.activeElement.isContentEditable;
      if (event.key === '/' && !typing) { event.preventDefault(); input.focus(); }
      else if (event.key === '?' && !typing) { helpPopover.togglePopover(); }
    });
    // --- Add a task (shared by the button and the Enter key) ---
    function addTask() {
      const text = input.value.trim(); // trim() ignores "   "-only input
      if (text === '') return;         // do nothing on empty input

      tasks.push({ text: text, done: false, due: dueInput.value });
      input.value = '';  // clear the box for the next task
      dueInput.value = ''; // clear the date too
      input.focus();     // keep the cursor ready for fast typing
      saveTasks();
      renderView();
    }

    addBtn.addEventListener('click', addTask);

    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') addTask();
    });

    // --- Filter buttons ---
    document.querySelector('.filters').addEventListener('click', function (event) {
      const btn = event.target.closest('button');
      if (!btn) return;
      filter = btn.dataset.filter;
      document.querySelectorAll('.filters button').forEach(function (b) {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      renderView();
    });

    // --- Edit: ✎ swaps text for input; Enter/blur saves, Escape cancels ---
    function startEdit(item, index) {
      const task = tasks[index];
      const span = item.querySelector('.task-text');
      const edit = document.createElement('input');
      edit.className = 'edit-input';
      edit.value = task.text;
      edit.setAttribute('aria-label', 'Edit task');
      span.replaceWith(edit);
      edit.focus();
      edit.setSelectionRange(edit.value.length, edit.value.length);
      let saved = false;
      const commit = function (save) {
        if (saved) return;
        saved = true;
        if (save) {
          const text = edit.value.trim();
          if (text !== '') task.text = text; // empty edit = keep old text
          saveTasks();
        }
        renderView();
        if (!save) input.focus();
      };
      edit.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') commit(true);
        else if (e.key === 'Escape') commit(false);
        e.stopPropagation(); // don't toggle complete while editing
      });
      edit.addEventListener('blur', function () { commit(true); });
      edit.addEventListener('click', function (e) { e.stopPropagation(); });
    }

    // --- Toggle complete when the task text is clicked ---
    // --- Delete when the ✕ button is clicked ---
    // One listener on the <ul> handles every item (even future ones).
    list.addEventListener('click', function (event) {
      if (event.target.classList.contains('edit-input')) return;
      const chip = event.target.closest('.tag-chip');
      if (chip) {
        activeTag = activeTag === chip.dataset.tag ? '' : chip.dataset.tag;
        renderView();
        return;
      }
      const editBtn = event.target.closest('.edit-btn');
      const item = event.target.closest('li'); // the <li> that was clicked
      if (!item || !('index' in item.dataset)) return;
      const index = Number(item.dataset.index); // which task in the array?
      if (!Number.isInteger(index) || index < 0 || index >= tasks.length) return;

      if (event.target.classList.contains('delete-btn')) {
        tasks.splice(index, 1);          // remove 1 item at that position
      } else if (editBtn) {
        startEdit(item, index);
        return; // no re-render; startEdit handles it
      } else if (event.target.closest('.task-text') ||
                 event.target.type === 'checkbox') {
        tasks[index].done = !tasks[index].done; // flip true/false
      } else {
        return; // badge / empty space: no action
      }
      saveTasks();
      renderView();
    });

    // --- Drag reorder: HTML5 DnD + keyboard (Alt+Arrow) ---
    list.addEventListener('dragstart', function (event) {
      const item = event.target.closest('li');
      if (!item || item.classList.contains('empty-message')) return;
      dragIndex = Number(item.dataset.index);
      event.dataTransfer.effectAllowed = 'move';
    });

    list.addEventListener('dragover', function (event) {
      const item = event.target.closest('li');
      if (!item || dragIndex < 0) return;
      event.preventDefault(); // allow drop
      document.querySelectorAll('#task-list li.drag-over').forEach(function (el) {
        el.classList.remove('drag-over');
      });
      item.classList.add('drag-over');
    });

    list.addEventListener('drop', function (event) {
      const item = event.target.closest('li');
      if (!item || dragIndex < 0) return;
      event.preventDefault();
      const to = Number(item.dataset.index);
      moveTask(dragIndex, to);
      dragIndex = -1;
    });

    list.addEventListener('dragend', function () {
      dragIndex = -1;
      document.querySelectorAll('#task-list li.drag-over').forEach(function (el) {
        el.classList.remove('drag-over');
      });
    });

    // Keyboard reorder: focus row (Tab to ✎/✕), Alt+ArrowUp/Down moves it.
    list.addEventListener('keydown', function (event) {
      if (!event.altKey || (event.key !== 'ArrowUp' && event.key !== 'ArrowDown')) return;
      const item = event.target.closest('li');
      if (!item || !('index' in item.dataset)) return;
      event.preventDefault();
      const index = Number(item.dataset.index);
      if (!Number.isInteger(index) || index < 0 || index >= tasks.length) return;
      moveTask(index, event.key === 'ArrowUp' ? index - 1 : index + 1);
      const rows = list.querySelectorAll('li[data-index]');
      for (const row of rows) {
        if (Number(row.dataset.index) === Math.max(0, Math.min(tasks.length - 1, event.key === 'ArrowUp' ? index - 1 : index + 1))) {
          const btn = row.querySelector('.edit-btn');
          if (btn) btn.focus();
        }
      }
    });

    // Touch reorder: long-press handle (~400ms) then drag vertically.
    let touchDrag = -1;
    let touchTimer = 0;
    let touchY = 0;
    list.addEventListener('pointerdown', function (event) {
      if (event.pointerType === 'mouse') return;
      const handle = event.target.closest('.drag-handle');
      if (!handle) return;
      const item = handle.closest('li');
      if (!item || !('index' in item.dataset)) return;
      const index = Number(item.dataset.index);
      touchY = event.clientY;
      clearTimeout(touchTimer);
      touchTimer = setTimeout(function () {
        touchDrag = index;
        item.classList.add('drag-over');
        if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }
      }, 400);
    });
    list.addEventListener('pointermove', function (event) {
      if (touchDrag < 0 || event.pointerType === 'mouse') return;
      event.preventDefault();
      const el = document.elementFromPoint(event.clientX, event.clientY);
      const over = el && el.closest ? el.closest('li[data-index]') : null;
      document.querySelectorAll('#task-list li.drag-over').forEach(function (row) {
        row.classList.remove('drag-over');
      });
      if (over) over.classList.add('drag-over');
      touchY = event.clientY;
    });
    function endTouchDrag(commit) {
      clearTimeout(touchTimer);
      if (touchDrag < 0) return;
      const el = document.elementFromPoint(window.innerWidth / 2, Math.max(0, touchY));
      const over = el && el.closest ? el.closest('li[data-index]') : null;
      const from = touchDrag;
      touchDrag = -1;
      document.querySelectorAll('#task-list li.drag-over').forEach(function (row) {
        row.classList.remove('drag-over');
      });
      if (commit && over) moveTask(from, Number(over.dataset.index));
    }
    list.addEventListener('pointerup', function () { endTouchDrag(true); });
    list.addEventListener('pointercancel', function () { endTouchDrag(false); });

    // App badge: open-task count when installed (Chromium-only, best-effort).
    function updateBadge() {
      try {
        if (!('setAppBadge' in navigator)) return;
        const open = tasks.filter(function (t) { return !t.done; }).length;
        if (open > 0) navigator.setAppBadge(open);
        else if ('clearAppBadge' in navigator) navigator.clearAppBadge();
      } catch (e) { /* badges best-effort */ }
    }

    function moveTask(from, to) {
      if (!Number.isInteger(from) || !Number.isInteger(to)) return;
      if (from < 0 || from >= tasks.length) return;
      to = Math.max(0, Math.min(tasks.length - 1, to));
      if (from === to) return;
      const moved = tasks.splice(from, 1)[0];
      tasks.splice(to, 0, moved);
      saveTasks();
      renderView();
      updateBadge();
    }
    function dayString(date) {
      return date.getFullYear() + '-' +
        String(date.getMonth() + 1).padStart(2, '0') + '-' +
        String(date.getDate()).padStart(2, '0');
    }

    // Returns one of: 'overdue' | 'today' | 'tomorrow' | 'soon' | 'later' | 'none'
    function isValidDue(due) {
      if (typeof due !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(due)) return false;
      const y = Number(due.slice(0, 4));
      const m = Number(due.slice(5, 7));
      const d = Number(due.slice(8, 10));
      if (m < 1 || m > 12 || d < 1 || d > 31) return false;
      const dt = new Date(y, m - 1, d);
      return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
    }

    function dueStatus(task) {
      if (!isValidDue(task.due)) return 'none';
      const today = dayString(new Date());
      if (task.due < today) return 'overdue';
      if (task.due === today) return 'today';
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      if (task.due === dayString(tomorrow)) return 'tomorrow';
      const soon = new Date();
      soon.setDate(soon.getDate() + 3); // "soon" = next 3 days
      if (task.due <= dayString(soon)) return 'soon';
      return 'later';
    }

    function dueLabel(task) {
      if (!isValidDue(task.due)) return '';
      const status = dueStatus(task);
      // Show friendly words for near dates, short date otherwise.
      // "2026-09-30" -> "30 Sep" (slice avoids timezone-shifted Date parsing)
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                      'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const short = task.due.slice(8, 10).replace(/^0/, '') + ' ' +
                    months[Number(task.due.slice(5, 7)) - 1];
      if (status === 'overdue') return 'Overdue · ' + short;
      if (status === 'today') return 'Today';
      if (status === 'tomorrow') return 'Tomorrow';
      if (status === 'soon') {
        const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const dt = new Date(Number(task.due.slice(0, 4)),
          Number(task.due.slice(5, 7)) - 1, Number(task.due.slice(8, 10)));
        return weekdays[dt.getDay()] + ' · ' + short;
      }
      return short;
    }

    // --- Draw the list from the tasks array ---
    function render() {
      list.innerHTML = ''; // wipe and rebuild (simple + fine at this size)

      // --- Counter: computed from state each time, never stored ---
      const left = tasks.filter(function (task) { return !task.done; }).length;
      counter.textContent = tasks.length === 0
        ? ''
        : left === 0
          ? 'All done! 🎉'
          : left + (left === 1 ? ' task' : ' tasks') + ' left';

      const visible = tasks
        .map(function (task, index) { return { task: task, index: index }; })
        .filter(function (entry) {
          if (filter === 'active' && entry.task.done) return false;
          if (filter === 'completed' && !entry.task.done) return false;
          if (activeTag && taskTags(entry.task.text).indexOf(activeTag) < 0) return false;
          return true;
        });
      tagBar.classList.toggle('visible', activeTag !== '');
      if (activeTag) tagClear.textContent = activeTag + ' ✕';

      if (tasks.length === 0) {
        list.innerHTML = '<li class="empty-message">No tasks yet — try “Buy milk #home” with a due date!</li>';
        return;
      }

      if (visible.length === 0) {
        list.innerHTML = '<li class="empty-message">Nothing here — try another filter.</li>';
        return;
      }

      visible.forEach(function (entry) {
        const task = entry.task;
        const index = entry.index;
        const item = document.createElement('li');
        if (task.done) item.classList.add('completed');
        item.classList.add('due-' + dueStatus(task)); // color stripe
        item.dataset.index = index; // remember position for clicks
        item.draggable = true;

        const handle = document.createElement('span');
        handle.className = 'drag-handle';
        handle.textContent = '⠿';
        handle.setAttribute('aria-hidden', 'true');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.setAttribute('aria-label', 'Mark ' + task.text + (task.done ? ' active' : ' done'));

        const span = document.createElement('span');
        span.className = 'task-text';
        renderTextWithTags(span, task.text); // #tags become clickable chips

        item.append(handle, checkbox, span);

        if (isValidDue(task.due)) {
          const badge = document.createElement('span');
          badge.className = 'due-badge';
          badge.textContent = dueLabel(task);
          badge.title = task.due; // full date on hover
          item.append(badge);
        }

        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.textContent = '✎';
        editBtn.setAttribute('aria-label', 'Edit ' + task.text);

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.setAttribute('aria-label', 'Delete ' + task.text);

        item.append(editBtn, delBtn);
        list.append(item);
      });
    }
    // --- Persistence: localStorage keeps data after refresh ---
    // localStorage only stores strings, so we convert with JSON.
    function saveTasks() {
      try {
        localStorage.setItem('todo-tasks', JSON.stringify(tasks));
      } catch (e) {
        counter.textContent = 'Could not save — storage full or blocked. Changes kept for this session.';
      }
      updateBadge();
    }

    function validTask(task) {
      return task && typeof task.text === 'string' &&
        typeof task.done === 'boolean' &&
        (typeof task.due === 'string' || typeof task.due === 'undefined');
    }

    function loadTasks() {
      const saved = localStorage.getItem('todo-tasks');
      if (!saved) return;
      try {
        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed) || !parsed.every(validTask)) throw new Error('bad shape');
        tasks = parsed;
        // Migrate tasks saved before due dates existed.
        tasks.forEach(function (task) {
          if (!('due' in task)) task.due = '';
        });
      } catch (e) {
        try { localStorage.setItem('todo-tasks-corrupt', saved); } catch (q) { /* keep going */ }
        tasks = []; // corrupted data? start fresh rather than crash
      }
    }
  </script>
</body>
</html>
