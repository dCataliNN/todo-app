<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <title>My To-Do List</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>My To-Do List</h1>
      <button id="theme-btn" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="layout">
      <nav class="sidebar" aria-label="Views">
        <button data-view="inbox">📥 Inbox <span class="count" id="count-inbox"></span></button>
        <button data-view="today">📅 Today <span class="count" id="count-today"></span></button>
        <button data-view="upcoming">🔜 Upcoming <span class="count" id="count-upcoming"></span></button>
        <button data-view="all">📋 All Tasks <span class="count" id="count-all"></span></button>
        <div class="side-head">
          <span class="side-label">Projects</span>
          <button id="project-add" aria-label="New project" title="New project">+</button>
        </div>
        <div id="side-projects"></div>
        <div class="side-head collapsible" id="tags-head">
          <span class="side-label">Tags</span>
          <span class="collapse-arrow" aria-hidden="true">▾</span>
        </div>
        <div id="side-tags"></div>
      </nav>
      <div class="main">
        <div class="input-row">
          <input id="task-input" type="text" placeholder="What needs doing? Try &quot;report p1 friday #work&quot;" autocomplete="off" aria-label="New task">
          <input id="due-input" type="date" aria-label="Due date (optional)">
          <button id="add-btn">Add</button>
        </div>
        <div class="input-row search-row">
          <input id="search-input" type="search" placeholder="Search tasks…" autocomplete="off" aria-label="Search tasks">
        </div>
        <div class="filters">
          <button data-filter="all" class="active" aria-pressed="true">All</button>
          <button data-filter="active" aria-pressed="false">Active</button>
          <button data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <div class="tag-bar" id="tag-bar">
          <button id="tag-clear"></button>
        </div>
        <div class="toolbar">
          <button id="copy-btn" title="Copy tasks as text">Copy</button>
          <button id="paste-btn" title="Paste tasks from clipboard">Paste</button>
          <button id="share-btn" title="Share via OS sheet">Share</button>
          <button id="export-btn" title="Download tasks as JSON">Export</button>
          <button id="import-btn" title="Import tasks from JSON">Import</button>
          <button id="notify-btn" aria-pressed="false" title="Due-date reminders">Remind</button>
          <button id="help-btn" title="Keyboard shortcuts (?)">?</button>
        </div>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
        <div id="help-popover" popover>
          <strong>Shortcuts</strong>
          <p><kbd>/</kbd> new task · <kbd>j</kbd>/<kbd>k</kbd> move between rows<br><kbd>Alt</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> reorder · <kbd>Enter</kbd> save · <kbd>Esc</kbd> cancel</p>
        </div>
        <ul id="task-list"></ul>
        <p class="counter" id="counter" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer-head">
      <h2 id="drawer-title">Task details</h2>
      <button id="drawer-close" aria-label="Close task details">✕</button>
    </div>
    <label class="drawer-field">
      <span>Title</span>
      <input id="drawer-title-input" type="text" autocomplete="off">
    </label>
    <label class="drawer-field">
      <span>Description</span>
      <textarea id="drawer-desc" rows="3" placeholder="Notes…"></textarea>
    </label>
    <div class="drawer-grid">
      <label class="drawer-field">
        <span>Due date</span>
        <input id="drawer-due" type="date">
      </label>
      <label class="drawer-field">
        <span>Due time</span>
        <input id="drawer-time" type="time">
      </label>
    </div>
    <div class="drawer-grid">
      <label class="drawer-field">
        <span>Priority</span>
        <select id="drawer-prio">
          <option value="0">None</option>
          <option value="1">P3 · Low</option>
          <option value="2">P2 · Medium</option>
          <option value="3">P1 · High</option>
          <option value="4">P4 · Lowest</option>
        </select>
      </label>
      <label class="drawer-check">
        <input id="drawer-done" type="checkbox">
        <span>Completed</span>
      </label>
    </div>
    <label class="drawer-field">
      <span>Tags (space-separated #tags)</span>
      <input id="drawer-tags" type="text" autocomplete="off" placeholder="#home #work">
    </label>
    <div class="drawer-grid">
      <label class="drawer-field">
        <span>Project</span>
        <select id="drawer-project"></select>
      </label>
      <label class="drawer-field">
        <span>Recurrence</span>
        <input id="drawer-recur" type="text" disabled placeholder="Phase 5">
      </label>
    </div>
  </aside>

  <div class="modal-scrim" id="project-scrim" hidden></div>
  <div class="modal" id="project-modal" role="dialog" aria-modal="true" aria-labelledby="project-modal-title" hidden>
    <h2 id="project-modal-title">New project</h2>
    <label class="drawer-field">
      <span>Name</span>
      <input id="project-name" type="text" autocomplete="off" maxlength="60">
    </label>
    <div class="drawer-grid">
      <div class="drawer-field">
        <span>Color</span>
        <div class="swatches" id="project-colors"></div>
      </div>
      <div class="drawer-field">
        <span>Icon</span>
        <div class="swatches" id="project-icons"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button id="project-cancel">Cancel</button>
      <button id="project-delete" hidden>Delete</button>
      <button id="project-save" class="primary">Save</button>
    </div>
    <p class="modal-note" id="project-delete-note" hidden></p>
    <div class="modal-actions" id="project-delete-actions" hidden>
      <button id="project-delete-inbox">Move tasks to Inbox</button>
      <button id="project-delete-cancel">Keep project</button>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
